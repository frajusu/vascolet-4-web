[package]
name = "vascolet-web"
version = "0.1.0"
edition = "2021"
description = "Vascolet remake jugable web (Rust + Bevy, GitHub Pages, localStorage, delta time, escalado HD)"

[dependencies]
bevy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"

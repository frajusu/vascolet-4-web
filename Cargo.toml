[package]
name = "vascolet-web"
version = "0.1.0"
edition = "2021"
description = "Vascolet remake jugable web (Rust + Bevy, GitHub Pages, localStorage, delta time, escalado HD)"

[dependencies]
bevy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
# getrandom 0.3 (transitivo de Bevy) exige feature + cfg en wasm:
# https://docs.rs/getrandom/0.3/#webassembly-support
getrandom = { version = "0.3", features = ["wasm_js"] }

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vascolet 4 — Tierra de Gigantes (port web)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #err{position:fixed;left:8px;bottom:8px;max-width:90vw;color:#ffb4b4;
       font:12px/1.4 monospace;white-space:pre-wrap;z-index:20}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         color:#cfe3ff;font:16px system-ui;text-align:center;z-index:10;pointer-events:none}
  #boot-failure{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a0a0cf2;color:#ffe6c8;font:16px system-ui}
  #boot-failure[hidden]{display:none}
  #boot-failure section{max-width:560px;margin:24px;padding:28px;border:1px solid #9d5632;background:#24130f}
  #boot-failure h1{font-size:23px;margin-top:0}
  #boot-failure button{padding:10px 18px;font:inherit;cursor:pointer}
  #boot-failure details{margin-top:20px}#boot-failure pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="512" height="384"></canvas></div>
<div id="boot">Cargando…</div>
<div id="err"></div>
<div id="boot-failure" role="alert" hidden><section>
  <h1>No se pudo iniciar el juego</h1>
  <p>No se pudieron cargar sus archivos. Podés volver a intentarlo sin borrar tu partida.</p>
  <button id="boot-retry" type="button">Volver a intentar</button>
  <details><summary>Detalle del error</summary><pre id="boot-details"></pre></details>
</section></div>
<script>
window.addEventListener("error",e=>{document.getElementById("err").textContent+="ERROR: "+(e.message||e.error)+"\n";});
window.addEventListener("unhandledrejection",e=>{document.getElementById("err").textContent+="REJECT: "+(e.reason&&(e.reason.stack||e.reason.message||e.reason))+"\n";});
</script>
<script id="game-loader" type="module" data-entry="./js/main.js">
const state = window.VascoletBoot = { ready:false, failed:false, entry:new URL(document.getElementById("game-loader").dataset.entry, document.baseURI).href };
const failure = document.getElementById("boot-failure");
function fail(error) {
  if(state.ready)return;
  state.failed=true;
  document.getElementById("boot")?.remove();
  document.getElementById("boot-details").textContent=error?.message||String(error);
  failure.hidden=false;
}
document.getElementById("boot-retry").onclick=()=>{
  const url=new URL(location.href);url.searchParams.set("_reload",Date.now());location.replace(url.href);
};
const timer=setTimeout(()=>fail(new Error("La descarga o el inicio tardó demasiado. Puede haber un archivo bloqueado o una conexión interrumpida.")),45000);
try {
  const app=await import(state.entry);
  await app.startup;
  if(app.currentScene?.()==="fatal")throw new Error(document.getElementById("err").textContent||"El juego no pudo terminar de iniciar.");
  state.ready=true;state.failed=false;failure.hidden=true;
} catch(error) { fail(error); }
finally { clearTimeout(timer); }
</script>
</body>
</html>
